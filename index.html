<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nanbi Studio</title>
<link rel="icon" type="image/svg+xml" href="icons/nanbi-monogram.svg"><link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C4653">
<!--
  NANBI CONSOLE — generic shell. Contains NO project data and NO secrets.
  Everything it shows is fetched at runtime from a private GitHub repository
  after the owner signs in with their own fine-grained token (kept in
  localStorage on this device only; never transmitted anywhere except
  api.github.com; never included in any file this app writes).
-->
<style>
:root{
  --navy:#2C4653; --teal:#527C79; --coral:#C9614A; --bg:#F2F4F2; --card:#FFFFFF;
  --text:#1A1A2E; --muted:#72807D; --border:#DFE5E2;
  --ok:#22C55E; --warn:#F59E0B; --danger:#EF4444; --info:#3B82F6;
  --radius:12px; --grid:8px; --stripe:4px; --rail:216px; --bar:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.5;padding-bottom:64px}
a{color:var(--teal)}
/* The top row spans the ENTIRE width; the left rail sits BELOW it (founder, 09 Aug).
   The brand rectangle is the exact width of the rail, so the two align as one grid. */
header.app{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
  height:var(--bar);display:flex;align-items:stretch;gap:0}
header.app .brandbox{display:flex;align-items:center;gap:10px;padding:0 18px;flex:none}
header.app h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em;white-space:nowrap}
header.app .navbtns{display:flex;align-items:center;gap:2px;padding:0 6px 0 10px}
header.app .navbtns button{background:rgba(255,255,255,.10);border:none;color:#fff;
  width:34px;height:32px;padding:0;border-radius:8px;font-size:16px;line-height:1}
header.app .navbtns button:hover{background:rgba(255,255,255,.20)}
header.app .spacer{flex:1}
header.app .conn{font-size:11.5px;padding:3px 10px;border-radius:999px;
  background:rgba(255,255,255,.15);align-self:center;margin-right:14px;white-space:nowrap}
main{max-width:1080px;margin:0 auto;padding:20px 24px 40px}
/* the selected section's name, left-aligned with the body — not in the top bar */
.pagehead{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}
.pagehead h2{margin:0;font-size:22px;color:var(--navy);font-weight:700}
.pagehead .sub{font-size:14px;color:var(--muted)}
.codetitle{color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.card h3{margin:16px 0 6px;font-size:16px;color:var(--navy)}
.small{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 0 8px;margin:0 -4px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:none;border-radius:999px;padding:8px 15px;font-size:14.5px}
button,.btn{font:inherit;border:1px solid var(--border);background:#fff;color:var(--navy);
  border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--coral);border-color:var(--coral);color:#fff}
button.quiet{border:none;background:none;color:var(--teal);padding:4px 6px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;width:100%;background:#fff;color:var(--text)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge-R{background:rgba(107,120,148,.15);color:#6B7894}
.badge-I{background:rgba(245,158,11,.15);color:#B45309}
.badge-P{background:rgba(239,68,68,.12);color:#B91C1C;border:1.5px solid #EF4444}
.badge-LOCKED{background:rgba(34,197,94,.15);color:#15803D}
.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover{background:rgba(27,122,138,.05)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.topiccard{border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;background:#fff}
.topiccard:hover{border-color:var(--teal)}
.topiccard b{color:var(--navy);font-size:15px;display:block;margin-bottom:2px}
.elem{border:1px solid var(--border);border-left:var(--stripe) solid var(--border);
  border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;background:#fff}
.elem.basis-P{border-left-color:var(--danger)}
.elem.basis-I{border-left-color:var(--warn)}
.elem.basis-R{border-left-color:var(--muted)}
.elem.ruled{border-left-color:var(--ok)}
.elem b{color:var(--navy)}
.elem .content{margin:4px 0;font-size:15px}
.sheet-back{position:fixed;inset:0;background:rgba(26,28,46,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;
  width:100%;max-width:720px;padding:20px 18px 28px}
.sheet h2{margin-top:0;color:var(--navy);font-size:19px}
blockquote{border-left:3px solid var(--teal);margin:8px 0;padding:4px 12px;color:var(--text);
  background:rgba(27,122,138,.05);border-radius:0 8px 8px 0;font-size:15px}
.q-founder{border-left-color:var(--danger);background:rgba(239,68,68,.05)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:8px 1px 6px;font-size:10.5px;color:var(--muted);
  text-decoration:none;display:flex;flex-direction:column;gap:1px;transition:background .12s}
.av-lg{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex:none}
nav.bottom a .av{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  flex:none;line-height:1}
nav.bottom a .ic{font-size:19px;line-height:1;width:22px;text-align:center;flex:none;
  display:inline-flex;align-items:center;justify-content:center}
nav.bottom a.active{color:var(--teal);font-weight:600}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--navy);
  color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:60;max-width:90vw}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;
  padding:10px 12px;font-size:15px;color:#991B1B;margin:8px 0}
.empty{border:2px dashed var(--border);border-radius:var(--radius);padding:28px 16px;
  text-align:center;color:var(--muted);font-size:15px;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff}
.kpi .n{font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);
  border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
footer.diag{max-width:980px;margin:20px auto 8px;padding:0 16px;font-size:11.5px;color:var(--muted)}
@media(min-width:768px){
  body{padding-bottom:0}
  /* full-width top row; rail BELOW it; both share --rail so they always align */
  nav.bottom{left:0;right:auto;top:var(--bar);bottom:0;width:var(--rail);flex-direction:column;
    border-top:none;border-right:1px solid var(--border);padding:10px 0 12px;
    justify-content:flex-start;background:var(--card)}
  nav.bottom a{flex:0 0 auto;flex-direction:row;gap:12px;align-items:center;
    padding:11px 18px;margin:0 8px;border-radius:8px;font-size:14.5px;text-align:left}
  nav.bottom a:hover{background:rgba(82,124,121,.10)}
  nav.bottom a.active{background:rgba(82,124,121,.14)}
  nav.bottom a.foot{margin-top:auto;border-top:1px solid var(--border);
    border-radius:0;margin-left:0;margin-right:0;padding-top:14px}
  nav.bottom a.foot:hover{background:rgba(82,124,121,.08)}
  header.app .brandbox{width:var(--rail);box-sizing:border-box}
  main{margin-left:var(--rail);max-width:1080px}
  footer.diag{margin-left:var(--rail)}
}
/* installed as an app: Windows/macOS already print the name in the title bar,
   so the in-app wordmark would be the second one. Show the mark alone. */
@media all and (display-mode:standalone){ header.app h1{display:none} }
html.installed header.app .brandbox{display:none}
html.installed header.app .navbtns{padding-left:16px}
#updatebar{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:70;
  background:var(--navy);color:#fff;border-radius:999px;padding:9px 10px 9px 18px;
  display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#updatebar button{background:var(--coral);border:none;color:#fff;border-radius:999px;padding:6px 14px}
#updatebar[hidden]{display:none}
@media(min-width:768px){ #updatebar{bottom:22px} }
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

/* ================= state ================= */
var S = {

/* ================= guards (G2/G3 + PAT refusal) =================
   The Contents API bypasses the repository's pre-commit hooks, so the same
   protections run here on EVERY outbound write body. No write path may skip this. */
var CRED_RE = new RegExp([
  "sk-ant-[A-Za-z0-9_-]{20,}","sk-[A-Za-z0-9]{40,}","AKIA[0-9A-Z]{16}",
  "ghp_[A-Za-z0-9]{36,}","github_pat_[A-Za-z0-9_]{50,}","GOCSPX-[A-Za-z0-9_-]{20,}",
  "ya29\\.[A-Za-z0-9_-]{20,}","\\b1//0[A-Za-z0-9_-]{40,}",
  "-----BEGIN [A-Z ]*PRIVATE KEY","(postgres|postgresql|neo4j\\+s)://[^\\s/]+:[^\\s@]+@"
].join("|"));
function guardWrite(text){
  if (S.pat && text.indexOf(S.pat) !== -1) return "the sign-in token itself";
  if (CRED_RE.test(text)) return "a credential-shaped string";
  // piiBlockB64 is base64 in config so the blocked string itself never appears in a tracked file
  if (S.cfg && S.cfg.piiBlockB64 && text.indexOf(atob(S.cfg.piiBlockB64)) !== -1) return "blocked personal data";
  return null;
}

/* ================= github api ================= */
function gh(path, opts){
  opts = opts || {};
  return fetch("https://api.github.com" + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      "Authorization":"Bearer " + S.pat,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    var rem = r.headers.get("x-ratelimit-remaining");
    if (rem !== null) S.rate = rem;
    if (r.status === 401){ authScreen("GitHub rejected the token string itself (401) — a mangled paste, "+
      "or the token expired or was revoked. Re-copy the exact token and paste it once. "+
      "(Permissions are NOT the problem — a permissions issue would be a 403 or 404.)"); throw new Error("401"); }
    if ((r.status === 403 || r.status === 404) && path.indexOf("/repos/") === 0 && !S.loaded){
      authScreen("Your token is valid, but it cannot reach "+S.repo.owner+"/"+S.repo.repo+" ("+r.status+"). "+
        "Open the token on GitHub and check: Resource owner = "+S.repo.owner+", and under "+
        "“Only select repositories” the repository "+S.repo.repo+" is selected, with "+
        "Contents and Actions both Read-and-write."); throw new Error(String(r.status));
    }
    if (!r.ok) return r.text().then(function(t){ throw new Error("HTTP " + r.status + " on " + path + " — " + t.slice(0,180)); });
    return r.status === 204 ? null : r.json();
  });
}
function b64utf8(b64){
  var bin = atob(b64.replace(/\n/g,""));
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function readFile(path){
  var r = S.repo;
  return gh("/repos/"+r.owner+"/"+r.repo+"/contents/"+encodeURI(path)+"?ref="+encodeURIComponent(r.branch))

function ist(d){
  d = d ? new Date(d) : new Date();
  return new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",
    day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false
  }).format(d) + " IST";
}
function daysOpen(iso){
  var ms = Date.now() - new Date(iso + "T00:00:00+05:30").getTime();
  return Math.max(0, Math.floor(ms/86400000));

/* ================= parsers (ports of the repo's proven board.py logic) ================= */
function parseDraft(md){
  // # CATEGORY A — NAME  →  ## A1 · TOPIC  →  | n | **Name** | content | anchors | basis |
  var cats=[], cat=null, topic=null, notes=[];
  var lines = md.split("\n");
  for (var i=0;i<lines.length;i++){
    var L=lines[i];
    var mc=L.match(/^# CATEGORY ([A-F]) — (.+)$/);
    if (mc){ cat={ id:mc[1], name:mc[2].trim(), topics:[] }; cats.push(cat); topic=null; continue; }
    var mt=L.match(/^## ([A-F]\d{1,2}) · (.+)$/);
    if (mt && cat){ topic={ id:mt[1], name:mt[2].trim(), elements:[], question:null, blurb:"" }; cat.topics.push(topic); continue; }
    if (topic){
      var mq=L.match(/^> \*\*Founder question[^:]*:\*\*\s*(.*)$/);
      if (mq){ topic.question=(mq[1]||"").trim();
        while (i+1<lines.length && /^> ?/.test(lines[i+1]) && !/^\s*$/.test(lines[i+1]))
          topic.question += " " + lines[++i].replace(/^> ?/,"").trim();
        continue; }
      var mw=L.match(/^\*What this answers: (.+)\*$/);
      if (mw){ topic.blurb=mw[1]; continue; }
      // Element rows come in two shapes: the standard 5-column
      // | n | **Name** | content | anchors | basis |  and E27's 4-column trade-off table
      // | n | **Name** | content | basis |  (no Anchor column). Both are the record's own
      // formats, so both parse — board.py counts rows the same way.
      var me=L.match(/^\|\s*(\d+)\s*\|\s*\*\*(.+?)\*\*\s*\|(.+)\|(.+)\|(.+)\|\s*$/) ||
             L.match(/^\|\s*(\d+)\s*\|\s*\*\*(.+?)\*\*\s*\|(.+)\|(.+)\|\s*$/);
      if (me){
        var five = me.length === 6;
        var basisCell=(five?me[5]:me[4]).trim();
        var mb=basisCell.match(/\*\*([RIP])\b/);
        topic.elements.push({
          no:+me[1], name:me[2].trim(), content:me[3].trim(),
          anchors:five?me[4].trim():"—", basis:mb?mb[1]:"?", basisNote:basisCell,
          locked:/LOCKED/.test(basisCell), key:topic.id+"/"+me[1]
        });
        continue;
      }
      if (/^\|\s*\d+\s*\|/.test(L)) notes.push("draft line "+(i+1)+": element row did not parse");
    }
  }
  var total=0; cats.forEach(function(c){c.topics.forEach(function(t){ total+=t.elements.length; });});
  return { cats:cats, total:total, notes:notes };
}
function parseApproved(md){
  // ## ID — name   counted only when first 400 chars carry *LOCKED|RATIFIED* and "Rajesh"
  var out=[], blocks=md.split(/\n## /).slice(1);
  blocks.forEach(function(b){
    var head=b.split("\n",1)[0].trim(), body=b.slice(0,400);
    if (/\*(LOCKED|RATIFIED)\b/.test(body) && body.indexOf("Rajesh")!==-1){
      var dm=body.match(/(\d{4}-\d{2}-\d{2})/);
      out.push({ id:head.split("—")[0].trim(), title:head, date:dm?dm[1]:"" });
    }
  });
  return out;
}
function parseJsonl(text,label){
  var out=[];
  text.split("\n").forEach(function(l,i){
    if(!l.trim()) return;
    try{ out.push(JSON.parse(l)); }
    catch(e){ S.parseNotes.push(label+" line "+(i+1)+": invalid JSON"); }
  });
  return out;
}
function anchorIndex(){
  // code (A5, B12, Rule-18…) -> the Constitution elements that cite it. Built from the
  // draft's own Anchor column, so the relationships are the record's, never invented.
  if (S._anchorIdx) return S._anchorIdx;
  var idx={};
  if (S.draft) S.draft.cats.forEach(function(c){ c.topics.forEach(function(t){
    t.elements.forEach(function(e){
      e.anchors.split("·").forEach(function(a){
        a=a.trim(); if(!a||a==="—") return;
        (idx[a]=idx[a]||[]).push({key:e.key,name:e.name,topic:t.id});
      });
    });
  });});
  S._anchorIdx=idx; return idx;
}
function titleOf(code){
  // A code with no title is a code you have to click to understand. Build the lookup
  // once from the registers, the VG checkpoints and the Constitution's own element names.
  if(!S._titles){
    var t={};
    if(S.register){
      (S.register.nn||[]).forEach(function(r){ t[r.code]=r.rule; });
      (S.register.wp||[]).forEach(function(r){ t[r.code]=r.rule; });
    }
    (S.vgCheckpoints||[]).forEach(function(c){ t[c.checkpoint_code]=c.name; });
    if(S.draft) S.draft.cats.forEach(function(c){ c.topics.forEach(function(tp){
      tp.elements.forEach(function(e){ t[e.key]=e.name; });
      t[tp.id]=tp.name;
    });});
    S._titles=t;
  }
  return S._titles[code]||"";
}
function codeLabel(code, href){
  // "A5 — Territory is the unit of trust", never a bare "A5"
  var ti=titleOf(code), body='<b>'+esc(code)+'</b>'+(ti?' <span class="codetitle">— '+esc(ti)+'</span>':"");
  return href ? '<a href="'+href+'">'+body+'</a>' : body;
}
function anchorLinks(anchors){
  // render each anchor code as a link into the registers, per the founder's Chat-43 ruling:
  // "hyperlinks between related items" — never plain text
  if(!anchors||anchors.trim()==="—") return "—";
  return anchors.split("·").map(function(a){
    a=a.trim(); if(!a) return "";
    return codeLabel(a, "#/registers?q="+encodeURIComponent(a));
  }).join("<br>");
}
function parseRegister(md){
  var nn=[], wp=[], mode=null, notes=[];
  var lines=md.split("\n");
  for (var i=0;i<lines.length;i++){
    var L=lines[i];
    if (/^## The full register/.test(L)) { mode="nn"; continue; }
    if (/^## Working Protocols/.test(L)) { mode="wp"; continue; }
    if (/^## /.test(L) && mode==="wp") { mode=null; continue; }
    if (!mode || !/^\|/.test(L) || /^\|[-\s|:]+\|$/.test(L) || /^\|\s*Code\s*\|/.test(L)) continue;
    var cells=L.split("|").slice(1,-1).map(function(c){return c.trim();});
    if (mode==="nn" && cells.length>=6){
      var m=cells[0].match(/(⚠)?\s*\*\*(.+?)\*\*/);
      if (m) nn.push({ code:m[2], collision:!!m[1], rule:cells[1], says:cells[2], why:cells[3], arch:cells[4], src:cells[5] });
      else notes.push("register line "+(i+1)+": NN row did not parse");
    } else if (mode==="wp" && cells.length>=5){
      var w=cells[0].match(/\*\*(.+?)\*\*/);
      if (w) wp.push({ code:w[1], rule:cells[1], status:cells[2].replace(/`/g,""), change:cells[3], src:cells[4] });
      else notes.push("register line "+(i+1)+": WP row did not parse");
    }
  }
  return { nn:nn, wp:wp, notes:notes };
}

function boot(){

    setConn("● connected");

  }).then(function(){

  }).catch(function(e){

      render('<div class="card"><h2>Could not reach the repository</h2>'+
        '<div class="err">'+esc(e.message)+'</div>'+
        '<button class="primary" onclick="boot()">Retry</button> '+
        '<button onclick="authScreen()">Change token</button></div>');

}
function loadAll(){
  S.parseNotes=[];
  var reads = {
    cfg:"webapp/config/app.json", theme:"webapp/config/theme.json",
    statuses:"webapp/config/statuses.json", models:"webapp/config/models.json",
    draft:"wiki/core-rules/CONSTITUTION-DRAFT.md",
    approved:"wiki/core-rules/CONSTITUTION-APPROVED.md",
    nnApproved:"wiki/core-rules/NN-APPROVED.md",
    register:"wiki/core-rules/REGISTER.md",
    decisions:".github/board/decisions.json",
    routing:"prompts/ROUTING.json",
    split:"webapp/config/split.json",
    vgTiers:"raw/mcp-db/service-simplified/vg_tiers.jsonl",
    vgCheckpoints:"raw/mcp-db/service-simplified/vg_checkpoints.jsonl"
  };
  var keys=Object.keys(reads);
  return Promise.all(keys.map(function(k){
    return readFile(reads[k]).then(function(f){return {k:k,f:f};},
      function(e){ S.parseNotes.push(reads[k]+" — "+e.message.slice(0,90)); return {k:k,f:null}; });
  })).then(function(rs){
    rs.forEach(function(r){
      if (!r.f) return;
      try{
        if (r.k==="cfg"||r.k==="theme"||r.k==="statuses"||r.k==="models"||r.k==="decisions"||r.k==="routing"||r.k==="split")
          S[r.k]=JSON.parse(r.f.text);
        else if (r.k==="draft"){ S.draft=parseDraft(r.f.text); S.parseNotes.push.apply(S.parseNotes,S.draft.notes); }
        else if (r.k==="approved") S.approved=parseApproved(r.f.text);
        else if (r.k==="nnApproved") S.nnApproved=parseApproved(r.f.text);
        else if (r.k==="register"){ S.register=parseRegister(r.f.text); S.parseNotes.push.apply(S.parseNotes,S.register.notes); }
        else if (r.k==="vgTiers") S.vgTiers=parseJsonl(r.f.text,"vg_tiers");
        else if (r.k==="vgCheckpoints") S.vgCheckpoints=parseJsonl(r.f.text,"vg_checkpoints");
      }catch(e){ S.parseNotes.push(r.k+" — parse failed: "+e.message); }
    });
    applyTheme(); diag();
  });
}

  if(t.bg)r.setProperty("--bg",t.bg); if(t.card)r.setProperty("--card",t.card);
  if(t.radius)r.setProperty("--radius",t.radius+"px");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function md(s){ // minimal inline markdown: bold, code, italics
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
}
function render(html){ document.getElementById("main").innerHTML=pagehead()+html; window.scrollTo(0,0); }

var PAGE={t:"",s:""};

function pagehead(){

function hardRefresh(){
  // last resort if a device is stuck on an old build: drop every cache and re-register
  if(!("serviceWorker" in navigator)) return location.reload(true);
  caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
  .then(function(){ return navigator.serviceWorker.getRegistrations(); })
  .then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })
  .then(function(){ location.reload(); });
}
function toast(t){
  var d=document.createElement("div"); d.className="toast"; d.textContent=t;
  document.body.appendChild(d); setTimeout(function(){d.remove();},2600);
}
function diag(){
  var exp=(S.cfg&&S.cfg.expected)||{};
  var parts=[];
  if(S.draft) parts.push("elements "+S.draft.total+(exp.elements?"/"+exp.elements:""));
  if(S.register) parts.push("NN "+S.register.nn.length+(exp.nn?"/"+exp.nn:"")+
                            " · WP "+S.register.wp.length+(exp.wp?"/"+exp.wp:""));
  if(S.vgCheckpoints) parts.push("VG "+S.vgCheckpoints.length+(exp.vgCheckpoints?"/"+exp.vgCheckpoints:""));
  if(S.approved) parts.push("ratified "+(S.approved.length+(S.nnApproved?S.nnApproved.length:0)));
  var bad=[];
  if(exp.elements&&S.draft&&S.draft.total!==exp.elements) bad.push("element count mismatch");
  if(exp.nn&&S.register&&S.register.nn.length!==exp.nn) bad.push("NN count mismatch");
  if(exp.wp&&S.register&&S.register.wp.length!==exp.wp) bad.push("WP count mismatch");
  document.getElementById("diag").innerHTML =
    "Parsed: "+parts.join(" · ")+(S.rate?" · API calls left this hour: "+S.rate:"")+
    (bad.length?' · <span style="color:var(--danger)">⚠ '+bad.join("; ")+"</span>":"")+
    (S.parseNotes.length?' · <span style="color:var(--danger)">'+S.parseNotes.length+
      ' parse note(s) — see Settings</span>':"")+
    " · Every failure is shown, never swallowed.";
}

function doAuth(){
  // Strip ALL whitespace, not just the ends — a paste from a notes app often carries
  // line breaks or a double-paste, and GitHub answers 401 to the mangled string.
  var pat=document.getElementById("f-pat").value.replace(/\s+/g,"");
  if(!pat) return toast("Paste the token first");
  if(!/^(github_pat_|ghp_)/.test(pat))
    return authScreen("That does not look like a GitHub token — it should start with github_pat_ "+
      "(fine-grained) or ghp_. Re-copy it from GitHub and paste only the token.");
  if(pat.length>255)
    return authScreen("The pasted text is "+pat.length+" characters — a token is under 100. "+
      "It looks like a double-paste. Clear the field and paste once.");
  S.pat=pat;
  S.repo={ owner:document.getElementById("f-owner").value.trim(),
           repo:document.getElementById("f-repo").value.trim(),
           branch:document.getElementById("f-branch").value.trim() };
  localStorage.setItem("nanbi.pat",S.pat);
  localStorage.setItem("nanbi.repo",JSON.stringify(S.repo));
  boot();
}

/* ---- the workroom: the Studio, scoped to the thing being worked on ----
   The founder's ruling: "after selecting the topic for discussion, studio should take
   place for our back and forth prompt and response in line with the topic." So the
   conversation happens HERE, carrying the topic as context — not in a separate screen
   where the context has to be retyped. */
function workroom(kind, id, label, context){
  WR[id]={ kind:kind, label:label, context:context };
  var roles={}; try{ roles=S.routing?S.routing.roles:{}; }catch(e){}
  var roleOpts=Object.keys(roles).map(function(k){
    return '<option value="'+esc(k)+'">'+esc(k)+'</option>'; }).join("");
  return '<div class="card"><h2>Studio — discuss '+esc(label)+'</h2>'+
    '<p class="small">Every model is fed this '+esc(kind)+' as context automatically, on top of its '+
    'full SSOT access. You never retype what is already on the screen.</p>'+
    '<label>Your prompt, in line with this '+esc(kind)+'</label>'+
    '<textarea id="wr-body" rows="4" placeholder="Challenge this· What does the record say about…· Draft the wording for…"></textarea>'+
    '<div class="row"><select id="wr-role" style="width:auto;min-width:180px">'+roleOpts+'</select>'+
    '<button class="primary" onclick="wrAsk(\''+esc(id)+'\')" id="wr-go">Ask the models</button></div>'+
    '<div id="wr-status"></div>'+
    '<h3>This '+esc(kind)+'&rsquo;s conversation</h3><div id="wr-runs"><span class="spin"></span></div></div>';

var WR={};
function wrAsk(id){

function putFile(path, content, message){
  // EVERY write passes the guards. The Contents API bypasses the repo's pre-commit
  // hooks, so the same protections run here, before anything leaves this device.
  var why = guardWrite(content);
  if (why) return Promise.reject(new Error("Write refused: the content contains " + why + ". Nothing was sent."));
  var r = S.repo;
  var bytes = new TextEncoder().encode(content), bin = "";
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return gh("/repos/"+r.owner+"/"+r.repo+"/contents/"+encodeURI(path), {
    method: "PUT",
    body: { message: message, content: btoa(bin), branch: r.branch }
  });
}
function listDir(path){
  var r = S.repo;
  return gh("/repos/"+r.owner+"/"+r.repo+"/contents/"+encodeURI(path)+"?ref="+encodeURIComponent(r.branch));
}
function mdBlocks(text){
  // Small block renderer for model answers: headings, tables, code fences, paragraphs.
  var out = [], lines = text.split("\n"), i = 0;
  while (i < lines.length){
    var L = lines[i];
    if (/^```/.test(L)){
      var code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push("<pre style='overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:12px'>"+esc(code.join("\n"))+"</pre>");
      continue;
    }
    if (/^\|/.test(L)){
      var rows = [];
      while (i < lines.length && /^\|/.test(lines[i])){
        if (!/^\|[-\s|:]+\|$/.test(lines[i]))
          rows.push(lines[i].split("|").slice(1,-1).map(function(c){return md(c.trim());}));
        i++;
      }
      var t = "<div class='tablewrap'><table>";
      rows.forEach(function(cs, ri){
        t += "<tr>" + cs.map(function(c){ return (ri===0?"<th>":"<td>") + c + (ri===0?"</th>":"</td>"); }).join("") + "</tr>";
      });
      out.push(t + "</table></div>");
      continue;
    }
    var mh = L.match(/^(#{1,4})\s+(.*)$/);
    if (mh){ out.push("<h3>"+md(mh[2])+"</h3>"); i++; continue; }
    if (/^\s*$/.test(L)){ i++; continue; }
    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|\||```)/.test(lines[i])) para.push(lines[i++]);
    out.push("<p style='font-size:13.5px'>"+md(para.join(" "))+"</p>");
  }
  return out.join("");
}

  .then(function(){ pollRun(status, 0); })
  .catch(function(e){
    btn.disabled=false;
    status.innerHTML='<div class="err">'+esc(e.message)+'</div>';
  });
}
function pollRun(status, tries){
  var r=S.repo, run=STUDIO.running;
  if(!run) return;
  var poll=(S.cfg&&S.cfg.pollSeconds||15)*1000;
  gh("/repos/"+r.owner+"/"+r.repo+"/actions/workflows/fanout.yml/runs?branch="+
     encodeURIComponent(r.branch)+"&per_page=5")
  .then(function(j){
    var mine=(j.workflow_runs||[]).find(function(w){
      return new Date(w.created_at).getTime() >= run.dispatchedAt - 60000;
    });
    var mins=Math.round((Date.now()-run.dispatchedAt)/6000)/10;
    if(!mine){
      status.innerHTML='<p class="small"><span class="spin"></span> Waiting for the run to appear… '+mins+' min</p>';
    } else if (mine.status!=="completed"){
      status.innerHTML='<p class="small"><span class="spin"></span> Models are answering — '+esc(mine.status)+
        ' · '+mins+' min elapsed (typically 1–3 min). You can leave this screen; the answers land in the repository either way.</p>';
    } else if (mine.conclusion==="success"){
      status.innerHTML='<p class="small">✅ Done in '+mins+' min. Opening the answers…</p>';
      var btn=document.getElementById("st-go"); if(btn) btn.disabled=false;
      location.hash="#/studio/run/"+encodeURIComponent(run.id);
      return;
    } else {
      status.innerHTML='<div class="err">The run finished with: '+esc(mine.conclusion)+
        '. <a href="'+esc(mine.html_url)+'" target="_blank" rel="noopener">Open the run log</a> — '+
        'a provider with no key configured reports NOT CONFIGURED and the others still answer.</div>'+
        '<p class="small"><a href="#/studio/run/'+encodeURIComponent(run.id)+'">Check for partial answers →</a></p>';
      var b2=document.getElementById("st-go"); if(b2) b2.disabled=false;
      return;
    }
    if (tries<80) setTimeout(function(){ pollRun(status,tries+1); }, poll);
    else status.innerHTML='<div class="err">Stopped watching after 20 minutes — check the Actions page for the run.</div>';
  })
  .catch(function(e){ status.innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}
function vResults(id){
  setCrumb("Answers","side by side, never merged");
  render('<div class="card"><h2>'+esc(id)+'</h2><div id="res"><span class="spin"></span> Fetching the answers…</div></div>');
  var box=document.getElementById("res");
  var dates=[0,1].map(function(off){ var d=new Date(Date.now()-off*86400000); return d.toISOString().slice(0,10); });
  var tryDate=function(di){
    if(di>=dates.length){
      box.innerHTML='<div class="empty">No answers filed yet for this prompt. If the run just finished, '+
        'give it a few seconds and <a href="#/studio/run/'+encodeURIComponent(id)+'">reload</a>.</div>';
      return;
    }
    var day=dates[di];
    // fan-out files sit flat: <id>__<provider>.md · cascade files sit in a directory <id>/
    listDir("raw/model-runs/"+day).then(function(items){
      var flat=(items||[]).filter(function(f){ return f.type==="file" && f.name.indexOf(id+"__")===0; });
      var dir=(items||[]).find(function(f){ return f.type==="dir" && f.name===id; });
      if (dir) return listDir("raw/model-runs/"+day+"/"+id).then(function(fs){ showAnswers(day+"/"+id, fs, box, true); });
      if (flat.length) return showAnswers(day, flat, box, false);
      tryDate(di+1);
    }, function(){ tryDate(di+1); });
  };
  tryDate(0);
}
function showAnswers(base, files, box, isCascade){
  files=(files||[]).filter(function(f){ return f.type==="file" && /\.md$/.test(f.name); });
  // COMPARE and TRACE last, FINAL first for cascade
  files.sort(function(a,b){
    var w=function(n){ return n.indexOf("FINAL")===0?0 : /COMPARE|TRACE/.test(n)?2 : 1; };
    return w(a.name)-w(b.name) || a.name.localeCompare(b.name);
  });
  if(!files.length){ box.innerHTML='<div class="empty">The run directory exists but holds no answers yet.</div>'; return; }
  box.innerHTML='<p class="small">'+files.length+' file(s) · answers are shown verbatim and never merged.</p>';
  files.forEach(function(f){
    var card=document.createElement("div"); card.className="card";
    card.innerHTML='<h2 style="font-size:14px">'+esc(f.name.replace(/\.md$/,""))+'</h2><p class="small"><span class="spin"></span></p>';
    box.appendChild(card);
    readFile("raw/model-runs/"+base+"/"+f.name).then(function(file){
      card.innerHTML='<h2 style="font-size:14px">'+esc(f.name.replace(/\.md$/,""))+'</h2>'+mdBlocks(file.text);
    }, function(e){ card.innerHTML+='<div class="err">'+esc(e.message)+'</div>'; });
  });
}
function loadRuns(){
  var el=document.getElementById("st-runs"); if(!el) return;
  readFile("manifests/MODEL-RUNS.md").then(function(f){
    var rows=[];
    f.text.split("\n").forEach(function(L){
      var cs=L.split("|").slice(1,-1).map(function(c){return c.trim();});
      if(cs.length>=5 && /^\d{4}-\d{2}-\d{2}$/.test(cs[0]))
        rows.push({date:cs[0], id:cs[1].replace(/`/g,""), models:cs[3], answered:cs[4]});
    });
    rows.reverse();
    if(!rows.length){ el.innerHTML='<div class="empty">No runs yet. The first one you send appears here.</div>'; return; }
    var h='<div class="tablewrap"><table><tr><th>Date</th><th>Prompt</th><th>Models</th><th>Answered</th></tr>';
    rows.slice(0,20).forEach(function(r){
      h+='<tr class="click" onclick="location.hash=\'#/studio/run/'+encodeURIComponent(r.id)+'\'">'+
        '<td class="small">'+esc(r.date)+'</td><td><b>'+esc(r.id)+'</b></td>'+
        '<td class="small">'+esc(r.models)+'</td><td class="small">'+esc(r.answered)+'</td></tr>';
    });
    el.innerHTML=h+'</table></div>';
  }, function(){ el.innerHTML='<div class="empty">No runs manifest yet — it appears with the first run.</div>'; });
}

function vSettings(){
  setCrumb("Account","who is signed in, and how this device is connected");
  var u=S.user||{};
  var h='<div class="card"><div class="row" style="gap:14px">'+
    '<span class="av av-lg">'+esc(((u.login||"R")[0]).toUpperCase())+'</span>'+
    '<span><b style="font-size:18px">'+esc(u.name||u.login||"Signed in")+'</b>'+
    (u.login?'<div class="small">@'+esc(u.login)+'</div>':"")+'</span>'+
    '<span class="spacer" style="flex:1"></span>'+
    '<span class="pill badge-LOCKED">connected</span></div></div>'+
    '<div class="card"><h2>Connection</h2>'+
    '<p class="small">Token on this device: <code>'+(S.pat?esc(S.pat.slice(0,10))+"…":"none")+'</code></p>'+
    '<p class="small">Repository: <code>'+esc(S.repo.owner+"/"+S.repo.repo)+'</code> · branch <code>'+esc(S.repo.branch)+'</code></p>'+
    '<p class="small">API calls remaining this hour: '+(S.rate||"—")+'</p>'+
    '<div class="row"><button onclick="forget()">Forget this device</button>'+
    '<button onclick="loadAll().then(route)">Reload data</button></div></div>';
  h+='<div class="card"><h2>Parser diagnostics</h2>';
  if (S.parseNotes.length){
    h+='<p class="small">Anything the parsers could not read is listed here rather than silently dropped:</p>';
    S.parseNotes.forEach(function(n){ h+='<div class="err">'+esc(n)+'</div>'; });
  } else h+='<div class="empty">All files parsed clean.</div>';
  h+='</div>';
  h+='<div class="card"><h2>About</h2><p class="small">Build <code>2026-08-09 r6</code> · '+
     '<button class="quiet" onclick="hardRefresh()">Force update</button></p>'+
     '<p class="small">Nanbi Studio — generic shell, no project data '+
     'inside it. Reads and writes the private SSOT repository with your token. Writes (from M3) are '+
     'scanned client-side for credentials and personal data before anything leaves this device; the '+
     'repository\u2019s own hooks enforce the same rules server-side. Viewed '+ist()+'</p></div>';
  render(h);
}
function forget(){
  localStorage.removeItem("nanbi.pat"); S.pat="";
  toast("Token removed from this device"); authScreen();
}

boot();
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(reg){
    reg.update();
    setInterval(function(){ reg.update(); }, 300000);
    reg.addEventListener("updatefound",function(){
      var w=reg.installing; if(!w) return;
      w.addEventListener("statechange",function(){
        if(w.state==="installed" && navigator.serviceWorker.controller){
          var b=document.getElementById("updatebar"); if(b) b.hidden=false;
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(window.__reloading) return; window.__reloading=true; location.reload();
  });
}
// the installed app supplies its own title bar; belt-and-braces for the CSS rule
if (window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone) document.documentElement.classList.add("installed");
</script>
